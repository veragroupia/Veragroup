<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prévia do link</title>
<!-- Molde da imagem de prévia (1200 x 630). Gere com: node tools/gerar-og.mjs -->
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--papel); }
  .og { position: relative; width: 1200px; height: 630px; padding: 56px 64px; box-sizing: border-box; }
  .og__topo { display: flex; justify-content: space-between; border-top: 2px solid var(--tinta); padding-top: 14px; font-size: 15px; color: var(--tinta-2); width: 640px; }
  .og__marca { margin: 44px 0 0; font-size: 150px; font-weight: 860; font-stretch: 112%; letter-spacing: -.058em; line-height: .8; }
  .og__frase { margin: 40px 0 0; width: 600px; font-size: 44px; font-weight: 760; font-stretch: 88%; letter-spacing: -.034em; line-height: 1.02; }
  .og__rodape { position: absolute; left: 64px; bottom: 50px; display: flex; gap: 22px; align-items: center; font-size: 15px; color: var(--tinta-2); }
  .og__rodape .status { font-size: 15px; color: var(--tinta); }
  .og__telas { position: absolute; right: 56px; top: 44px; width: 440px; height: 560px; }
  .og__telas .celular { position: absolute; width: 230px; }
  .og__telas .um { right: 190px; top: 40px; }
  .og__telas .dois { right: 0; top: 0; }
  .status--ar::before { animation: none; }
</style>
</head>
<body>
  <div class="og">
    <div class="og__topo mono"><span>Sites, lojas e sistemas</span><span>Interior de SP</span></div>
    <p class="og__marca">Vera<span class="marca__ponto">.</span></p>
    <p class="og__frase">Trabalhos no ar. Preço na mesa.</p>
    <div class="og__rodape mono"><span class="status status--ar">No ar</span><span>Itu · Salto · Sorocaba · Indaiatuba</span></div>
    <div class="og__telas">
      <div class="celular um"><img src="../assets/img/erk-mobile.webp" alt=""></div>
      <div class="celular celular--claro dois"><img src="../assets/img/voneis-mobile-produtos.webp" alt=""></div>
    </div>
  </div>
</body>
</html>
