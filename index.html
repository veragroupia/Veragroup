    <script>
      // decide a versão leve antes da primeira pintura (evita a página pular quando o JS chega)
      (function () {
        var p = new URLSearchParams(location.search), m = p.get('modo'), n = navigator, gl = false;
        try { gl = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
        var fraco = (n.deviceMemory !== undefined && n.deviceMemory <= 2) || (n.hardwareConcurrency || 8) <= 2;
        if (m === '2d' || !gl || (fraco && m !== '3d')) document.documentElement.classList.add('modo-2d');
      })();
    </script>
